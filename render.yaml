# Render blueprint. Deploys as a *web service* rather than a background worker, because
# free-tier Render offers no workers — only services that bind a port.
#
# Free web services spin down after 15 minutes without traffic, so an external pinger
# (UptimeRobot, every 5 minutes) must hit the health URL to keep polling alive.
#
# DATABASE_URL is NOT set here on purpose. Render's own free Postgres expires 30 days
# after creation, so point this at a free database that does not expire — Neon or
# Supabase — and set the value in the Render dashboard as a secret.
services:
  - type: web
    name: instagram-tracker
    runtime: python
    plan: free
    region: oregon
    # `pip install .` and not `-r requirements.txt`: this is a src/ layout, so the
    # package must be installed for `python -m instagram_tracker` to resolve. Installing
    # only the requirements leaves the dependencies present and the app missing.
    buildCommand: pip install .
    startCommand: python -m instagram_tracker
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: INSTAGRAM_USERNAME
        value: zero2sudo
      - key: STORY_PROVIDER
        value: igexport
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: BIO_POLL_INTERVAL_SECONDS
        value: "3600"
      # Overnight the account does not post: 0 of 96 observed Stories fell between
      # 23:00 and 06:00 Pacific, across two samples a month apart. Polled every 800s
      # instead of every 60s, which is ~27% fewer requests a day. Raised from 600s on
      # 2026-09-03 to watch whether overnight detection latency changes at all.
      - key: POLL_TIMEZONE
        value: America/Los_Angeles
      - key: QUIET_HOUR_START
        value: "23"
      - key: QUIET_HOUR_END
        value: "6"
      - key: QUIET_POLL_INTERVAL_SECONDS
        value: "800"
      - key: PROCESS_EXISTING_STORIES_ON_STARTUP
        value: "false"
      - key: RENDER_PROXY_URL
        value: https://r.jina.ai/{url}
      # Set these in the dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_NEW_GRAD_WEBHOOK_URL
        sync: false
      - key: DISCORD_INTERNSHIP_WEBHOOK_URL
        sync: false
      - key: DISCORD_REVIEW_WEBHOOK_URL
        sync: false
      - key: DISCORD_NEW_GRAD_MENTIONS
        sync: false
      - key: DISCORD_INTERNSHIP_MENTIONS
        sync: false
      - key: HEARTBEAT_URL
        sync: false
